.tx-c{text-anchor:middle}
@media (prefers-reduced-motion:no-preference){
  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:d 1.6s cubic-bezier(.4,.1,.2,1) forwards;animation-delay:calc(.3s + var(--i) * .07s)}
  .hid,.frame,.axis,.dim,.bubble,.sym,.sym-fill,.tx,.ln-soft:not(.draw){opacity:0;animation:o 1s ease forwards;animation-delay:1.2s}
}
@keyframes d{to{stroke-dashoffset:0}}
@keyframes o{to{opacity:1}}
</style>
